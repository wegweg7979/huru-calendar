name: Go CI

on:
  push:
    branches:
      - "**"
    paths:
      - "core/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "core/**"
      - ".github/workflows/go-ci.yml"

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./core/go.mod
          cache-dependency-path: core/go.sum

      - name: Format check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run

  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./core/go.mod
          cache-dependency-path: core/go.sum

      - name: Run tests
        run: go test ./...

  # This fork ships the daemon only: no submodules, no -tags withshell, no Qt.
  # The upstream UI build lives in its own workflow and is not carried here.
  build:
    name: Headless build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: ./core/go.mod
          cache-dependency-path: core/go.sum

      - name: Build
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/hcal ./cmd/hcal
          /tmp/hcal version
